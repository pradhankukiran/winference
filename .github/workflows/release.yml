name: Release

# Every push to main replaces the "Latest build" pre-release with a new installer.
# Pushing a tag like v1.0.1 also creates a permanent "Winference 1.0.1" release.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup if missing
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed.' }
          }

      - name: Work out the version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$project = Get-Content src\Winference.App\Winference.App.csproj
            $base = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
            $version = "$base.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Bad version '$version'." }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Version: $version"

      - name: Build app and installer
        run: scripts\Build-Windows.ps1 -Installer -Version ${{ steps.version.outputs.value }}

      # Tests run after the locked build: their restore rewrites the shared lock files.
      - name: Run unit tests
        run: scripts\Test-Windows.ps1

      - name: Publish "Latest build"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $setup = "artifacts\installer\Winference-Setup-$env:VERSION.exe"
          $notes = "Automatic build $env:VERSION from commit $env:GITHUB_SHA.`n`nUnsigned: on the Windows SmartScreen warning, choose More info, then Run anyway."
          gh release delete latest-build --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest-build $setup --prerelease --target $env:GITHUB_SHA `
            --title "Latest build ($env:VERSION)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }

      - name: Publish version release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $setup = "artifacts\installer\Winference-Setup-$env:VERSION.exe"
          gh release create $env:GITHUB_REF_NAME $setup --verify-tag --latest `
            --title "Winference $env:VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
